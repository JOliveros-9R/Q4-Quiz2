<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Score Analyzer</title>
</head>
<body>
    <div class="container text-center mt-5">
        <h1>Score Analyzer</h1>
        <button class="btn btn-secondary" onclick="toggleclickme()">Click Me</button>
        <p id="clickme">
            Enter your grade in the following subjects below.
        </p>
        <div class="container">
            <div class="row text-center">
                <div class="col">
                    <img src="https://pbs.twimg.com/profile_images/1568157257547776000/GYDW-1Zn_400x400.jpg" class="img-fluid" alt="Math">
                    <input type="number" id="Math" class="form-control mt-2" placeholder="Math">
                </div>
                <div class="col">
                    <img src="https://static.vecteezy.com/system/resources/previews/015/484/601/original/modern-science-particle-or-molecule-element-logo-design-logo-for-science-atom-biology-technology-physics-lab-free-vector.jpg" class="img-fluid" alt="Science">
                    <input type="number" id="Science" class="form-control mt-2" placeholder="Science">
                </div>
                <div class="col">
                    <img src="https://thumbs.dreamstime.com/b/round-english-subject-concept-black-chalkboard-vector-linear-round-concept-english-subject-school-lesson-children-133564272.jpg" class="img-fluid" alt="English">
                    <input type="number" id="English" class="form-control mt-2" placeholder="English">
                </div>
            </div>
            <div class="text-center mt-4">
                <button class="btn btn-secondary" onclick="calculateGrade()">Get Rating</button>
            </div>
            <p class="note">Note: Grading Criteria and Equivalents can vary depending on school or district.</p>
        </div>
    </div>

         <footer>
         	<center><hr><p>&#169; AY 2025 | ICT 9 RUBY | QUIZ 2 | Joaquin Oliverods</p></center>

         </footer>


		<script src="main.js"></script>

</body>
</html>
